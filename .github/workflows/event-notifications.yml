name: Notifications des événements

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: amelone-event-notifications
  cancel-in-progress: false

jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Traiter les notifications avec une identité GitHub temporaire
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          audience = "amelone-event-notifications"
          endpoint = "https://amelone.onrender.com/notifications/traiter/"
          token = None
          refreshed_at = 0
          totals = dict.fromkeys(("attempted", "accepted", "failed", "uncertain", "skipped", "waiting"), 0)
          deadline = time.monotonic() + 8 * 60

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def fail(message):
              print(message)
              raise SystemExit(1)

          for batch in range(100):
              if time.monotonic() >= deadline:
                  print("Durée maximale atteinte ; la prochaine exécution reprendra la file.")
                  break
              try:
                  phase = "identité GitHub"
                  if token is None or time.monotonic() - refreshed_at >= 120:
                      parts = urllib.parse.urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
                      query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
                      query = [(key, value) for key, value in query if key != "audience"]
                      query.append(("audience", audience))
                      url = urllib.parse.urlunsplit(parts._replace(query=urllib.parse.urlencode(query)))
                      identity_request = urllib.request.Request(url, headers={
                          "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
                          "Accept": "application/json",
                      })
                      with opener.open(identity_request, timeout=25) as response:
                          token = json.load(response)["value"]
                      if not isinstance(token, str) or not token:
                          fail("Identité GitHub indisponible.")
                      print("::add-mask::" + token)
                      refreshed_at = time.monotonic()
                  phase = "traitement Render"
                  request = urllib.request.Request(endpoint, data=b"{}", method="POST", headers={
                      "Authorization": "Bearer " + token, "Content-Type": "application/json",
                      "Accept": "application/json",
                  })
                  with opener.open(request, timeout=90) as response:
                      result = json.load(response)
                  for key in totals:
                      value = result.get(key, 0)
                      if isinstance(value, int) and not isinstance(value, bool) and 0 <= value <= 100000:
                          totals[key] += value
                  if result.get("enabled") is not True:
                      print("Notifications désactivées : aucun envoi demandé.")
                      break
                  if result.get("attempted", 0) == 0:
                      print("Aucune tentative disponible ; la prochaine exécution reprendra la file.")
                      break
              except urllib.error.HTTPError as error:
                  fail("Interruption pendant " + phase + " (HTTP " + str(error.code) + "). Nouvelle vérification au prochain passage.")
              except (urllib.error.URLError, TimeoutError, OSError, ValueError, KeyError):
                  fail("Interruption pendant " + phase + " : réseau ou réponse indisponible. Vérification au prochain passage.")
          print("Compteurs : " + json.dumps(totals, sort_keys=True))
          PY
