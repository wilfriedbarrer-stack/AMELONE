{{ form.menu_options|json_script:"menu-options" }}
<script>
(() => {
 const availability = document.getElementById('id_availability'), menu = document.getElementById('id_menu');
 const noMeal = document.getElementById('id_no_meal'), beverage = document.getElementById('id_beverage');
 const snacks = ['id_morning_snack', 'id_afternoon_snack'].map(id => document.getElementById(id)).filter(Boolean);
 if (!menu || !noMeal) return;
 const options = JSON.parse(document.getElementById('menu-options').textContent);
 const isFullDay = () => availability ? availability.value === 'full_day' : '{{ form.meal_availability|default:"full_day"|escapejs }}' === 'full_day';
 function updateMenus() {
  if (!availability) return;
  const previous = menu.value, type = isFullDay() ? 'full_meal' : 'snack';
  menu.replaceChildren(new Option('Choisir selon la présence', ''));
  for (const option of options) {
   if (option.type !== type && option.legacy !== availability.value) continue;
   const label = option.label || option.name + ' — supplément ' + (option.surcharge / 100).toLocaleString('fr-FR', {style:'currency',currency:'EUR'});
   menu.add(new Option(label, option.id));
  }
  if ([...menu.options].some(option => option.value === previous)) menu.value = previous;
  const entitlement = document.getElementById('meal-entitlement');
  if (entitlement) entitlement.textContent = isFullDay() ? 'À la journée, choisissez un repas complet et, si vous le souhaitez, une collation le matin et une l’après-midi.' : 'À la demi-journée, choisissez une collation.';
 }
 function updateMeal() {
  menu.disabled = noMeal.checked;
  if (beverage) beverage.disabled = noMeal.checked;
  if (noMeal.checked) { menu.value = ''; if (beverage) beverage.value = ''; }
  for (const snack of snacks) {
   const row = snack.closest('.field');
   if (row) { row.hidden = !isFullDay(); row.style.display = isFullDay() ? '' : 'none'; }
   snack.disabled = noMeal.checked || !isFullDay();
   if (snack.disabled) snack.value = '';
  }
 }
 if (availability) availability.addEventListener('change', () => {updateMenus(); updateMeal();});
 noMeal.addEventListener('change', updateMeal);
 updateMenus(); updateMeal();
})();
</script>
