{% if page_obj.has_other_pages %}
  <nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
      <a class="button button-quiet button-small" href="?page={{ page_obj.previous_page_number }}">Précédent</a>
    {% else %}<span></span>{% endif %}
    <span>Page <strong>{{ page_obj.number }}</strong> sur {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="button button-quiet button-small" href="?page={{ page_obj.next_page_number }}">Suivant</a>
    {% endif %}
  </nav>
{% endif %}
