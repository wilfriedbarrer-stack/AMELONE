databases:
  - name: amelone-db
    plan: free
    databaseName: amelone
    user: amelone

services:
  - type: web
    name: amelone
    plan: free
    runtime: python
    buildCommand: bash render-build.sh
    startCommand: gunicorn amelone.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --access-logfile -
    healthCheckPath: /sante/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amelone-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: EMAIL_ENABLED
        value: "0"
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
